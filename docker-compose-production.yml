services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    command: npm run dev:docker
    restart: unless-stopped
    environment:
      PORT: "4000"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: /tmp/downloads
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEV_KEEP_FILES: ${DEV_KEEP_FILES:-false}
      COOKIES_FILE: /app/cookies.txt
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - downloads_data:/tmp/downloads
      - ${COOKIES_HOST_PATH:-/dev/null}:/app/cookies.txt

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_SITE_URL: ${VITE_SITE_URL:-}
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
      VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
      VITE_CREATED_BY: ${VITE_CREATED_BY:-}
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles: ["certbot"]

volumes:
  redis_data:
  downloads_data:
  letsencrypt:
  certbot_webroot:
